services:
  redis:
    image: redis:7-alpine
    container_name: asteroid-redis
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    #extra_hosts:
     # - "host.docker.internal:host-gateway"

volumes:
  redis_data:
